[package]
name = "refindex"
version = "0.1.0"
edition = "2024"
description = "Hybrid search over references/: BM25 (tantivy) + code embeddings (candle) + symbol graph"
publish = false

# A developer tool, not part of the product workspace: its dependency graph stays out of
# the workspace lockfile and cargo-deny policy.
[workspace]

[[bin]]
name = "refx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
candle-core = { version = "0.11.1", features = ["metal"] }
candle-nn = { version = "0.11.1", features = ["metal"] }
candle-transformers = { version = "0.11.1", features = ["metal"] }
clap = { version = "4", features = ["derive"] }
half = "2"
ureq = "3"
rayon = "1"
regex = "1"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.25"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
toml = "0.9"
tokio ={ version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tree-sitter = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1"
tree-sitter-objc = "3"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-zig = "1"

[profile.release]
debug = false
lto = "thin"
codegen-units = 4
