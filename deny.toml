# What `cargo deny check` holds for every dependency: no known vulnerability, a licence we may ship, one registry.
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # ferroni, the pure-Rust Oniguruma behind code highlighting (ADR-0002).
    "BSD-2-Clause",
    "BSD-3-Clause",
    # clipboard-win and error-code, arboard's Windows clipboard.
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# shadcn's path dependency on gui has no version, and needs none.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# shadcn ships the glyphs of its icon libraries (`crates/shadcn/assets/icons/`, THIRD_PARTY.md). Its own code is MIT;
# Lucide is ISC (its Feather-derived glyphs MIT); Tabler, Hugeicons and Phosphor are MIT; Remix Icon 4.8.0 is
# Apache-2.0 (from 4.9.0 it has its own licence, which is not permissive). The hashes (xxHash32) tie the expression to
# the licence files; `shadcn`'s test `icons::tests::deny_clarifies_the_vendored_licences` keeps them in step.
[[licenses.clarify]]
crate = "shadcn"
expression = "MIT AND ISC AND Apache-2.0"
license-files = [
    { path = "assets/icons/lucide/LICENSE", hash = 0xb739b6e3 },
    { path = "assets/icons/tabler/LICENSE", hash = 0xcd85e776 },
    { path = "assets/icons/hugeicons/LICENSE", hash = 0x7c61ccd4 },
    { path = "assets/icons/phosphor/LICENSE", hash = 0xd4d44d3f },
    { path = "assets/icons/remixicon/LICENSE", hash = 0x0a6d4ed6 },
]
