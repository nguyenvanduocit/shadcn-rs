[package]
name = "shadcn"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gui = { path = "../gui" }
# The calendars' today: the day it is in the local time zone, as reka's
# `today(getLocalTimeZone())`. The IANA database is bundled, so a zone names
# the same days on every machine, as the browser's own ICU copy does.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
# Shiki's tokens and GitHub themes for code blocks, in Rust (ADR-0002).
irosashi = "0.3.1"
# Diagnosis only (ADR-0023): `--features dhat-heap` makes the examples
# profile the heap with dhat instead of counting it.
dhat = { version = "0.3", optional = true }

[features]
default = ["lucide"]
dhat-heap = ["dep:dhat"]
# The icon libraries `Theme.icons` selects from (`shadcn::icons`), as shadcn-vue's icon loader lists them. Each carries
# only the glyphs of the icon roles, under `assets/icons/<library>/` (licences in THIRD_PARTY.md and deny.toml).
lucide = []
tabler = []
hugeicons = []
phosphor = []
remixicon = []

[dev-dependencies]
# The stress example's `--a11y` feeds each update to the tree a platform
# adapter keeps, to time what a screen reader's side spends on it (ADR-0021).
accesskit = "0.25"
accesskit_consumer = "0.39"
# The gallery's Markdown, as shadcn-vue's docs render agent replies (comark).
pulldown-cmark = { version = "0.13", default-features = false }
