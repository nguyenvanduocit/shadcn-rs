<!-- Flexbox §4.5 with a preferred aspect ratio: a box whose width comes from its height through the ratio, shrinking; empty, holding a 70px child, and with min-width: 0. -->
<div style="width: 300px">
  <div style="display: flex; width: 100px">
    <div style="height: 50px; aspect-ratio: 2 / 1"></div>
    <div style="flex: none; width: 60px"></div>
  </div>
  <div style="display: flex; width: 100px">
    <div style="height: 50px; aspect-ratio: 2 / 1"><div style="width: 70px; height: 10px"></div></div>
    <div style="flex: none; width: 60px"></div>
  </div>
  <div style="display: flex; width: 100px">
    <div style="height: 50px; aspect-ratio: 2 / 1; min-width: 0"><div style="width: 70px; height: 10px"></div></div>
    <div style="flex: none; width: 60px"></div>
  </div>
  <div style="display: flex; width: 100px">
    <div style="flex: 1; min-width: 0; aspect-ratio: 2 / 1"></div>
    <div style="flex: none; width: 60px"></div>
  </div>
</div>
