<!-- Percentages: of an unknown height they behave as auto; a stretched item of a row is definite, so a percentage inside it resolves, also when the row's height is its content's; a percentage width inside a content-sized box resolves after the box was sized without it. -->
<div style="width: 400px">
  <div style="display: flex; width: 200px">
    <div style="width: 50px; height: 50%"><div style="height: 40px"></div></div>
    <div style="width: 50px; height: 60px"></div>
  </div>
  <div style="display: flex; flex-direction: column; width: 200px">
    <div style="height: 50%"><div style="height: 40px"></div></div>
    <div style="height: 20px"></div>
  </div>
  <div style="display: flex; width: 200px">
    <div style="width: 50px"><div style="height: 100%"></div><div style="height: 50%"></div></div>
    <div style="width: 50px; height: 60px"></div>
  </div>
  <div style="display: flex; width: 200px; height: 80px">
    <div style="width: 50px"><div style="height: 50%"></div></div>
    <div style="width: 50%; height: 25%"></div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: flex-start">
    <div><div style="width: 50%; height: 10px"></div><p>Sized by this text</p></div>
    <div style="display: flex"><p style="width: 50%">Half of the row it widens</p><div style="width: 40px"></div></div>
  </div>
  <div style="display: flex; width: 200px">
    <div style="flex: 1; min-width: 0"><div style="width: 100%; height: 10px"></div></div>
    <div style="flex: 1; min-width: 0"><div style="width: 150%; height: 10px"></div></div>
  </div>
</div>
