    </div>
    <div style="flex: none; width: 50px; height: 24px"></div>
  </div>
  <div style="display: flex; width: 150px">
    <div style="display: flex; flex: 1; min-width: 0">
      <div style="display: flex; flex: 1"><p style="flex: 1; white-space: nowrap">Nested label that is long</p></div>
    </div>
    <div style="flex: none; width: 50px; height: 24px"></div>
  </div>

    </div>
