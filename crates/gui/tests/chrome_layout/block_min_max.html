<!-- min and max sizes win over width and height, min over max. -->
<div style="width: 300px">
  <div style="width: 50px; min-width: 100px; height: 10px"></div>
  <div style="max-width: 120px; height: 10px"></div>
  <div style="width: 200px; max-width: 50%; height: 10px"></div>
  <div style="height: 5px; min-height: 25px"></div>
  <div style="height: 50px; max-height: 15px"></div>
  <div style="width: 100px; max-width: 40px; min-width: 60px; height: 10px"></div>
</div>
