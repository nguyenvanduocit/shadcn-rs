  <div style="display: grid; grid-template-columns: auto auto">
    <div style="width: 50px; height: 20px"></div><div style="width: 120px; height: 10px"></div>
    <div style="width: 80px; height: 30px"></div><div style="width: 10px"></div>
  </div>
  <div style="display: grid; grid-template-columns: auto 1fr">
    <div style="width: 50px; height: 20px"></div><div style="height: 10px"></div>
  </div>
</div>
