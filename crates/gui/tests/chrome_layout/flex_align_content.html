<!-- align-content places the lines of a wrapping row in a tall container. -->
<div style="width: 200px">
  <div style="display: flex; flex-wrap: wrap; height: 120px; align-content: center">
    <div style="width: 120px; height: 20px"></div><div style="width: 120px; height: 30px"></div><div style="width: 120px; height: 10px"></div>
  </div>
  <div style="display: flex; flex-wrap: wrap; height: 120px; align-content: space-between">
    <div style="width: 120px; height: 20px"></div><div style="width: 120px; height: 30px"></div><div style="width: 120px; height: 10px"></div>
  </div>
  <div style="display: flex; flex-wrap: wrap; height: 120px">
    <div style="width: 120px"></div><div style="width: 120px; height: 30px"></div>
  </div>
</div>
