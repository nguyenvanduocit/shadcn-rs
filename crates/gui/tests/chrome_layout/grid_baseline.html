<!-- align-items: baseline in a grid row lines up first baselines, of a wrapped paragraph too. -->
<div style="display: grid; grid-template-columns: 80px 80px 80px; align-items: baseline; width: 400px">
  <p style="font-size: 12px; line-height: 16px">Small</p>
  <p style="font-size: 24px; line-height: 32px">Large</p>
  <div style="padding-top: 6px"><p>Two lines of base text</p></div>
</div>
