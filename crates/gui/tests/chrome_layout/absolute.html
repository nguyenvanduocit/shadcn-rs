<!-- Absolute boxes against their positioned parent: insets, insets that size, percent insets. -->
<div style="width: 400px; height: 300px; padding: 10px; border-width: 5px">
  <div style="position: absolute; left: 20px; top: 30px; width: 50px; height: 40px"></div>
  <div style="position: absolute; right: 10px; bottom: 20px; width: 60px; height: 30px"></div>
  <div style="position: absolute; left: 100px; right: 100px; top: 100px; bottom: 100px"></div>
  <div style="position: absolute; left: 50%; top: 25%; width: 10%; height: 10%"></div>
  <div style="height: 20px"></div>
</div>
