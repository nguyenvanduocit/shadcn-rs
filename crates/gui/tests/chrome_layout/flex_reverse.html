  <div style="display: flex; flex-direction: row-reverse; height: 20px">
    <div style="width: 50px"></div><div style="width: 70px"></div><div style="width: 30px"></div>
  </div>
  <div style="display: flex; flex-direction: column-reverse; height: 150px">

  </div>
</div>
