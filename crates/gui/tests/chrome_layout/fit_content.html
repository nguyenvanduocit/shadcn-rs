<!-- width: fit-content shrinks a block to its content, at most its container. -->
<div style="width: 200px">
  <div style="width: fit-content"><div style="width: 70px; height: 10px"></div></div>
  <div style="width: fit-content"><p>Shrink to fit</p></div>
  <div style="width: fit-content"><p>This text is longer than the container is wide</p></div>
</div>
