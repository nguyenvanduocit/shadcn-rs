<!-- aspect-ratio in block flow: an auto width stretches and the ratio gives the height, a definite height gives the width (at least its min-content width), each axis keeps its own min and max, a scroll container has no content minimum, and a container's content makes it taller. -->
<div style="width: 400px">
  <div style="aspect-ratio: 8"></div>
  <div style="aspect-ratio: 2; max-height: 30px"></div>
  <div style="aspect-ratio: 8; min-height: 70px"></div>
  <div style="height: 30px; aspect-ratio: 2"></div>
  <div style="height: 30px; aspect-ratio: 2; max-width: 40px"></div>
  <div style="height: 30px; aspect-ratio: 2; min-width: 90px"></div>
  <div style="height: 30px; aspect-ratio: 2; max-height: 20px"></div>
  <div style="height: 30px; aspect-ratio: 2; min-height: 40px"></div>
  <p style="height: 24px; aspect-ratio: 1">Words</p>
  <div style="max-width: 100px; aspect-ratio: 4"></div>
  <div style="width: 100px; aspect-ratio: 4"><p>A ratio box whose words wrap over lines</p></div>
  <div style="width: 100px; aspect-ratio: 4; overflow: hidden"><p>A ratio box whose words wrap over lines</p></div>
  <div style="width: 100px; aspect-ratio: 4; max-height: 50px"><p>A ratio box whose words wrap over lines</p></div>
  <div style="width: 100px; height: 20px; aspect-ratio: 1"></div>
  <div style="width: 25%; aspect-ratio: 2; padding: 10px"></div>
  <div style="aspect-ratio: 8; margin: 0 100px"></div>
  <div style="width: 100px; aspect-ratio: 1; min-width: 150px"></div>
  <div style="width: 100px; aspect-ratio: 1; max-width: 60px; min-height: 80px"></div>
</div>
