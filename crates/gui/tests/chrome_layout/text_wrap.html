<!-- A paragraph wrapped at a width: its height counts the lines. -->
<div style="width: 400px">
  <div style="width: 120px"><p>The quick brown fox jumps over the lazy dog</p></div>
  <div style="width: 200px"><p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.</p></div>
  <div style="display: flex; width: 150px"><p>Wrapped text as a flex item takes all the width</p></div>
</div>
