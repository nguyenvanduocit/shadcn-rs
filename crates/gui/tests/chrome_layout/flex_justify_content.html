<!-- Every justify-content value on a row of three 40px items in 300px. -->
<div style="width: 300px">
  <div style="display: flex; height: 10px; justify-content: flex-start"><div style="width: 40px"></div><div style="width: 40px"></div><div style="width: 40px"></div></div>
  <div style="display: flex; height: 10px; justify-content: center"><div style="width: 40px"></div><div style="width: 40px"></div><div style="width: 40px"></div></div>
  <div style="display: flex; height: 10px; justify-content: flex-end"><div style="width: 40px"></div><div style="width: 40px"></div><div style="width: 40px"></div></div>
  <div style="display: flex; height: 10px; justify-content: space-between"><div style="width: 40px"></div><div style="width: 40px"></div><div style="width: 40px"></div></div>
  <div style="display: flex; height: 10px; justify-content: space-around"><div style="width: 40px"></div><div style="width: 40px"></div><div style="width: 40px"></div></div>
  <div style="display: flex; height: 10px; justify-content: space-evenly"><div style="width: 40px"></div><div style="width: 40px"></div><div style="width: 40px"></div></div>
</div>
