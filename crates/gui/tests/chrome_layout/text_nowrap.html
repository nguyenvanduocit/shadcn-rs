<!-- white-space: nowrap keeps one line even when it overflows its container. -->
<div style="width: 100px">
  <p style="white-space: nowrap">This line does not wrap at all</p>
  <p>This line wraps</p>
  <div style="display: flex"><p style="white-space: nowrap">No wrap in a flex row</p></div>
</div>
