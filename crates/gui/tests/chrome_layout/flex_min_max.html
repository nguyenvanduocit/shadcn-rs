<!-- Growing is clamped by max-width and shrinking by min-width; the freed space goes to the others. -->
<div style="width: 300px">
  <div style="display: flex; height: 10px">
    <div style="flex-grow: 1; max-width: 50px"></div><div style="flex-grow: 1"></div><div style="flex-grow: 1"></div>
  </div>
  <div style="display: flex; height: 10px">
    <div style="width: 200px; min-width: 180px"></div><div style="width: 200px"></div>
  </div>
  <div style="display: flex; flex-direction: column; height: 100px; width: 50px">
    <div style="flex-grow: 1; min-height: 70px"></div><div style="flex-grow: 1; max-height: 10px"></div>
  </div>
</div>
