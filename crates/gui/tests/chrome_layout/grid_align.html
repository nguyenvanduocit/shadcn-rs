<!-- justify-items and align-items in 100px cells, and the self overrides. -->
<div style="display: grid; grid-template-columns: 100px 100px; grid-template-rows: 100px 100px; justify-items: center; align-items: center">
  <div style="width: 20px; height: 30px"></div>
  <div style="width: 20px; height: 30px; justify-self: end; align-self: start"></div>
  <div style="width: 20px; height: 30px; justify-self: start; align-self: end"></div>
  <div style="justify-self: stretch; align-self: stretch"></div>
</div>
