<!-- An absolute child of a flex container leaves flow; with no insets it sits at the static position. -->
<div style="display: flex; width: 300px; height: 100px; justify-content: center; align-items: center">
  <div style="width: 40px; height: 40px"></div>
  <div style="position: absolute; width: 20px; height: 20px"></div>
  <div style="position: absolute; top: 5px; left: 5px; width: 20px; height: 20px"></div>
  <div style="width: 40px; height: 40px"></div>
</div>
