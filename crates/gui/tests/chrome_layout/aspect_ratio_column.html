<!-- aspect-ratio on flex column items: a stretched width gives the height, a definite height gives the width when not stretched (at least the content's min-content width), and the content can make an item taller than its ratio. -->
<div style="width: 400px">
  <div style="display: flex; flex-direction: column"><div style="aspect-ratio: 8"></div><div style="aspect-ratio: 8; max-width: 100px"></div><div style="aspect-ratio: 2; max-height: 30px"></div></div>
  <div style="display: flex; flex-direction: column; align-items: flex-start"><div style="width: 100px; aspect-ratio: 2"></div><div style="height: 30px; aspect-ratio: 2"></div><p style="height: 24px; aspect-ratio: 1">Words</p><div style="height: 30px; aspect-ratio: 2; max-width: 40px"></div></div>
  <div style="display: flex; flex-direction: column; align-items: flex-start"><p style="width: 100px; aspect-ratio: 4">A ratio box whose words wrap over lines</p><div style="width: 100px; aspect-ratio: 2; min-height: 80px"></div></div>
  <div style="display: flex; flex-direction: column; height: 100px"><div style="aspect-ratio: 8; flex-grow: 1"></div><div style="width: 100px; aspect-ratio: 1; flex-shrink: 1"></div></div>
</div>
