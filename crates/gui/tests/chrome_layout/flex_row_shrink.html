<!-- Overflowing items shrink by flex-shrink weighted by their basis; flex-shrink 0 keeps its size. -->
<div style="width: 300px">
  <div style="display: flex; height: 10px">
    <div style="width: 200px; flex-shrink: 1"></div>
    <div style="width: 200px; flex-shrink: 2"></div>
    <div style="width: 200px; flex-shrink: 1"></div>
  </div>
  <div style="display: flex; height: 10px">
    <div style="width: 200px; flex-shrink: 0"></div>
    <div style="width: 200px"></div>
  </div>
</div>
