<!-- Rows inside columns inside a row: sizes flow down and content sizes flow up. -->
<div style="display: flex; width: 400px; height: 200px; padding: 10px; column-gap: 10px">
  <div style="display: flex; flex-direction: column; width: 100px; row-gap: 4px">
    <div style="height: 30px"></div>
    <div style="display: flex; flex-grow: 1"><div style="flex-grow: 1"></div><div style="width: 30px"></div></div>
  </div>
  <div style="display: flex; flex-direction: column; flex-grow: 1">
    <div style="display: flex; height: 50px"><div style="width: 60px"></div><div style="width: 60px; padding: 5px"><div style="height: 10px"></div></div></div>
    <div style="flex-grow: 1"></div>
  </div>
</div>
