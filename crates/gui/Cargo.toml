[package]
name = "gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The per-thread slots engine state is stored in (crate::engine).
gui-tls = { path = "../gui-tls" }
# The OS display boundary (ADR-0029): outputs, their refresh, colour and
# headroom, and vsync ticks. The one crate that holds `unsafe`; gui forbids it.
gui-display = { path = "../gui-display" }
# What a screen reader is told about each frame (AccessKit), and its adapter
# to the platform's accessibility API through the winit window.
accesskit = "0.25"
accesskit_winit = "0.34"
arboard = { version = "3", default-features = false }
cpu-time = "1"
memory-stats = "1"
png = "0.18.1"
# The embedded icons are SVG: roxmltree reads the XML, svgtypes the path
# data (arcs as cubics); `gui` rasterizes them itself (ADR-0017).
roxmltree = "0.21"
svgtypes = "0.16"
# The heap counted per process and per thread (ADR-0023): a counting
# `GlobalAlloc` wrapper, since the workspace forbids `unsafe`.
smelt-perf = "0.3"
# Pinned (ADR-0027): gui owns its layout engine; Taffy gives the vocabulary of
# the CSS algorithms and the general grid, and is upgraded when we choose.
taffy = "=0.15.1"
# Shadows, filters and grid tracks are kept inline in a node's style, so a
# binding that writes them allocates nothing (ADR-0022).
smallvec = { version = "1", features = ["const_generics", "const_new"] }
# Layout's thread pool (ADR-0014): dirty subtrees lay out as parallel jobs.
rayon = "1"
# Without `wayland-csd-adwaita`: on Wayland, when the compositor leaves the
# decorations to the client, gui draws its own title bar and frame with its
# GPU renderer (`window::decoration`), so sctk-adwaita and tiny-skia are not built.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# The render and platform threads run at display priority, as Chromium raises
# its compositor thread (ADR-0015): a QoS class on macOS, a thread priority on
# Windows, a nice value (or rtkit) on Linux, behind a safe API.
gdt-cpus = "0.2606"
# The GPU renderer: wgpu (Metal on macOS, Vulkan on Linux, DX12 on Windows;
# no OpenGL: compute is required, ADR-0016), etagere to pack glyphs and icons into atlas pages as GPUI does,
# pollster to wait on the adapter and on read-backs.
wgpu = "30"
etagere = "0.3"
# Instance records are plain `u32` words, cast to bytes for upload without copying (ADR-0016).
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
# Text (ADR-0019): Parley shapes, breaks lines and edits, fontique finds and
# falls back between system fonts; glyph outlines, hinting and colour glyphs
# are read with skrifa and rasterised by `gui` itself.
# Fast hashing for the glyph and shape caches (keys are ours, not attacker-chosen).
foldhash = "0.2"
# Pinned exactly: `text-wrap` pretty and balance rely on the line breaker's
# doc-hidden `BreakLines::set_prior_line_width` (a narrowed line aligned in
# the whole box) and on reverting it to a saved `BreakerState`; a patch
# release may change either. Re-check text::tests when raising it.
parley = { version = "=0.13.0", features = ["complex-scripts"] }
# The grapheme clusters and words of text a clamp hides, read to a screen
# reader without shaping it: Parley's own analysis, so they are the words
# its shaped text has.
parley_engine = "0.13"
skrifa = "0.49"
# Colour glyphs (COLRv0/v1 emoji) are painted by vello_cpu, which has
# every gradient COLRv1 needs (sweep included) and blend modes.
vello_cpu = { version = "0.4", default-features = false, features = ["std", "f32_pipeline"] }

# The user's text rendering settings, read as Chrome reads them (ADR-0019).
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
# Retired instructions for the bench (ADR-0023): the process's, from proc_pid_rusage.
libproc = "0.15"

# Retired instructions for the bench (ADR-0023): the thread's, from perf_event_open.
[target.'cfg(target_os = "linux")'.dependencies]
perf-event = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
x11rb = "0.13"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# fontconfig loaded when run, not linked when built: no development package needed to build.
fontique = { version = "0.13", features = ["fontconfig-dlopen"] }


[dev-dependencies]
# The assembled shaders parsed and validated against the Rust side (V3,
# `gpu/contract/`). The version wgpu 30 builds, so no second copy is compiled.
naga = { version = "=30.0.2", default-features = false, features = ["wgsl-in"] }
# Turns the device's features and downlevel flags into naga's capabilities,
# as wgpu does when it validates a module.
wgpu-naga-bridge = "=30.0.2"
# The tree a platform adapter keeps, to check that incremental updates keep
# AccessKit's contract and equal the whole tree (ADR-0021).
accesskit_consumer = "0.39"
# Text snapshots of the layout and accessibility dumps (M9 I4), reviewed
# with `cargo insta review` and rewritten with INSTA_UPDATE=always.
insta = "1"
# The kept-closure lint (ADR-0015, tests/kept_closures.rs): gui, primitives
# and shadcn sources parsed, so a closure kept outside `Stored` is found by
# its type, not by the text on its line.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
