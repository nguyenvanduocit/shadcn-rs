[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/nguyenvanduocit/shadcn-rs"
publish = false

# The compiler only helps while nothing bypasses it: these hold for every crate, each of which takes
# them with `[lints] workspace = true`. Outside tests, code that can panic or silently change a value does not compile: an index is
# `get`, arithmetic is `checked_*`/`saturating_*`, a cast is `From`/`TryFrom`, an ignored result is handled. A finding that
# is right where it stands is kept with `#[expect(lint, reason = "...")]` at its line, which warns once it no longer applies.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A clone whose value is never used after it: the rule against `clone()` added only to satisfy the borrow checker, which
# clippy keeps in its nursery group, off by default.
redundant_clone = "deny"

# No debug info in dev: on macOS any debug info keeps every object file on
# disk (split-debuginfo=unpacked), tens of GB across the test binaries.
# Panic messages keep their file:line; only backtrace line numbers go.
[profile.dev]
debug = false

# Line tables keep a profiler's samples readable at a fraction of full debug info's size.
[profile.release]
debug = "line-tables-only"

# What a shipped app builds with (`cargo build --profile dist`): release with whole-program optimisation, one codegen unit
# and no symbols or debug info. `release` stays as it is, since the bench and the verdict measure it.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
